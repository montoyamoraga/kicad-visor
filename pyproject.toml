[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-visor"
version = "0.1.0"
description = "Extract docs (schematics, PCB layers, history videos) from KiCad projects"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
kicad-visor = "kicad_visor.cli:main"

[tool.setuptools]
packages = ["kicad_visor"]
