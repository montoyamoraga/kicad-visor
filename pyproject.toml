[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-visor"
version = "0.1.0"
description = "Docs out of KiCad projects: schematics, PCB layers, 3D renders and looping turntable videos"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []
keywords = ["kicad", "pcb", "electronics", "documentation", "render", "video"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://github.com/piruetasxyz/kicad-visor"

[project.scripts]
kicad-visor = "kicad_visor.cli:main"

[tool.setuptools]
packages = ["kicad_visor"]
